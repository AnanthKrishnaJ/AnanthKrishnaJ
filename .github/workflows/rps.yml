name: Rock Paper Scissors

# A visitor clicks a move in README.md, which opens an issue titled
# "rps|rock", "rps|paper" or "rps|scissors". This plays the bot's move,
# updates the board and README, replies on the issue and closes it.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  play:
    if: startsWith(github.event.issue.title, 'rps|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pick the bot's move
        run: echo "BOT_MOVE=$(shuf -n1 -e rock paper scissors)" >> "$GITHUB_ENV"
      - name: Play and update the profile
        env:
          # untrusted text is passed through env, never pasted into the script
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # several people may play at once: start from the newest main each try
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            rm -f .rps-reply.md
            node scripts/rps.mjs
            git add data assets/rps README.md
            if git diff --cached --quiet; then break; fi
            git commit -m "game: rock paper scissors round #${ISSUE_NUMBER} by @${ISSUE_USER}"
            if git push origin HEAD:main; then break; fi
            sleep $(( (RANDOM % 6) + 2 ))
          done
      - name: Reply and close the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -f .rps-reply.md ]; then
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file .rps-reply.md
          fi
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY"
