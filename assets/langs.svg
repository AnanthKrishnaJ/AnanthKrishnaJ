<svg xmlns="http://www.w3.org/2000/svg" width="400" height="195" viewBox="0 0 400 195" role="img" aria-label="Most used languages">
  <defs><clipPath id="bar"><rect width="350" height="8" rx="4"/></clipPath>
  <linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
  <style>
    .row{opacity:0;animation:fade .45s ease-in-out forwards}
    @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
    .grow{transform:scaleX(0);transform-origin:left;transform-box:fill-box;animation:grow 1.1s .25s cubic-bezier(.4,.2,.2,1) forwards}
    @keyframes grow{to{transform:scaleX(1)}}
    .glint{animation:glint 3.5s 1.6s ease-in-out infinite;transform:translateX(-80px)}
    @keyframes glint{0%{transform:translateX(-80px)}50%,100%{transform:translateX(370px)}}
  </style>
  <rect x=".5" y=".5" width="399" height="194" rx="10" fill="#0b0b0b" stroke="#333333"/>
  <text x="25" y="38" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#ffffff" class="row">Most Used Languages</text>
  <g transform="translate(25 62)" clip-path="url(#bar)"><g class="grow"><rect x="0" y="0" width="140.5" height="8" fill="#ffffff"/><rect x="140" y="0" width="105.5" height="8" fill="#cfcfcf"/><rect x="245" y="0" width="70.5" height="8" fill="#a3a3a3"/><rect x="315" y="0" width="35.5" height="8" fill="#7a7a7a"/></g><rect class="glint" width="60" height="8" fill="url(#gl)"/></g>
  <g transform="translate(25 100)"><g class="row" style="animation-delay:0.5s">
      <circle cx="5" cy="-5" r="5" fill="#ffffff"/><text x="16" y="0" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#d6d6d6">HTML </text></g></g><g transform="translate(200 100)"><g class="row" style="animation-delay:0.6s">
      <circle cx="5" cy="-5" r="5" fill="#cfcfcf"/><text x="16" y="0" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#d6d6d6">JavaScript </text></g></g><g transform="translate(25 128)"><g class="row" style="animation-delay:0.7s">
      <circle cx="5" cy="-5" r="5" fill="#a3a3a3"/><text x="16" y="0" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#d6d6d6">CSS </text></g></g><g transform="translate(200 128)"><g class="row" style="animation-delay:0.9s">
      <circle cx="5" cy="-5" r="5" fill="#7a7a7a"/><text x="16" y="0" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#d6d6d6">Python </text></g></g>
</svg>
