  <text x="600" y="58" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#f5f5f5">Thanks for dropping by <tspan fill="#ffffff">✿</tspan> またね!</text>
